<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond navy arrondi -->
  <rect width="512" height="512" rx="90" fill="#1a2744"/>

  <!-- Ondes radio GAUCHE (ouvrant à gauche, bien séparées de la croix)
       Extrémités à x=118 : avec le linecap rond (+11) le trait s'arrête à
       x=129, soit 18 px avant le bras de la croix (x=147). Auparavant les
       ondes chevauchaient la croix de 26 px — le symbole respire enfin. -->
  <path d="M 118 158 A 72 72 0 0 0 118 258" fill="none" stroke="#c9a84c" stroke-width="22" stroke-linecap="round"/>
  <path d="M 96 118 A 110 110 0 0 0 96 288" fill="none" stroke="#c9a84c" stroke-width="19" stroke-linecap="round"/>

  <!-- Ondes radio DROITE (symétriques : axe x=256 → 394 et 416) -->
  <path d="M 394 158 A 72 72 0 0 1 394 258" fill="none" stroke="#c9a84c" stroke-width="22" stroke-linecap="round"/>
  <path d="M 416 118 A 110 110 0 0 1 416 288" fill="none" stroke="#c9a84c" stroke-width="19" stroke-linecap="round"/>

  <!-- Croix dorée -->
  <rect x="237" y="82" width="38" height="290" rx="9" fill="#c9a84c"/>
  <rect x="147" y="168" width="218" height="38" rx="9" fill="#c9a84c"/>

  <!-- Ellipses concentriques à la base (ripples) -->
  <ellipse cx="256" cy="382" rx="42" ry="13" fill="none" stroke="#c9a84c" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="256" cy="400" rx="72" ry="21" fill="none" stroke="#c9a84c" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="256" cy="422" rx="104" ry="30" fill="none" stroke="#c9a84c" stroke-width="8" stroke-linecap="round"/>
</svg>
