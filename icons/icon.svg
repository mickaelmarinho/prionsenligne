<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond navy arrondi -->
  <rect width="512" height="512" rx="90" fill="#1a2744"/>

  <!-- Ondes radio GAUCHE (ouvrant vers la gauche) -->
  <path d="M 203 154 A 82 82 0 0 0 203 272" fill="none" stroke="#c9a84c" stroke-width="24" stroke-linecap="round"/>
  <path d="M 164 110 A 128 128 0 0 0 164 316" fill="none" stroke="#c9a84c" stroke-width="21" stroke-linecap="round"/>

  <!-- Ondes radio DROITE (ouvrant vers la droite) -->
  <path d="M 309 154 A 82 82 0 0 1 309 272" fill="none" stroke="#c9a84c" stroke-width="24" stroke-linecap="round"/>
  <path d="M 348 110 A 128 128 0 0 1 348 316" fill="none" stroke="#c9a84c" stroke-width="21" stroke-linecap="round"/>

  <!-- Croix (par-dessus les ondes) -->
  <rect x="233" y="78" width="46" height="316" rx="14" fill="#c9a84c"/>
  <rect x="105" y="182" width="302" height="46" rx="14" fill="#c9a84c"/>

  <!-- Cercles concentriques à la base -->
  <ellipse cx="256" cy="396" rx="48" ry="15" fill="none" stroke="#c9a84c" stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="256" cy="413" rx="80" ry="24" fill="none" stroke="#c9a84c" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="256" cy="432" rx="114" ry="34" fill="none" stroke="#c9a84c" stroke-width="9" stroke-linecap="round"/>
</svg>
