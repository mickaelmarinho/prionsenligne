<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond navy arrondi -->
  <rect width="512" height="512" rx="90" fill="#1a2744"/>

  <!-- Ondes radio GAUCHE (ouvrant à gauche, bien séparées de la croix) -->
  <path d="M 162 158 A 72 72 0 0 0 162 258" fill="none" stroke="#c9a84c" stroke-width="22" stroke-linecap="round"/>
  <path d="M 140 118 A 110 110 0 0 0 140 288" fill="none" stroke="#c9a84c" stroke-width="19" stroke-linecap="round"/>

  <!-- Ondes radio DROITE (ouvrant à droite, bien séparées de la croix) -->
  <path d="M 350 158 A 72 72 0 0 1 350 258" fill="none" stroke="#c9a84c" stroke-width="22" stroke-linecap="round"/>
  <path d="M 372 118 A 110 110 0 0 1 372 288" fill="none" stroke="#c9a84c" stroke-width="19" stroke-linecap="round"/>

  <!-- Croix dorée -->
  <rect x="237" y="82" width="38" height="290" rx="9" fill="#c9a84c"/>
  <rect x="147" y="168" width="218" height="38" rx="9" fill="#c9a84c"/>

  <!-- Ellipses concentriques à la base (ripples) -->
  <ellipse cx="256" cy="382" rx="42" ry="13" fill="none" stroke="#c9a84c" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="256" cy="400" rx="72" ry="21" fill="none" stroke="#c9a84c" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="256" cy="422" rx="104" ry="30" fill="none" stroke="#c9a84c" stroke-width="8" stroke-linecap="round"/>
</svg>
